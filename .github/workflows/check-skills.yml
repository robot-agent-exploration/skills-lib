name: check-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get the checker from main
        run: git show origin/main:scripts/check_skills.py > "$RUNNER_TEMP/check_skills.py"
      - name: Check the whole library
        run: python3 "$RUNNER_TEMP/check_skills.py" .
      - name: Check the contribution rules
        if: github.event_name == 'pull_request'
        run: python3 "$RUNNER_TEMP/check_skills.py" . --base "origin/${{ github.base_ref }}"
